name: Publish NPM Packages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/**/npm/**'
      - 'node-sdk/packages/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - google-analytics
          - google-adsense
          - facebook-ads
          - create-game

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@eduardoks98'

      # Publish @eduardoks98/google-analytics
      - name: Publish @eduardoks98/google-analytics
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'google-analytics' || github.event.inputs.package == 'all'))
        working-directory: packages/google/analytics/npm
        run: |
          npm install
          chmod +x ./node_modules/.bin/*
          ./node_modules/.bin/tsup src/index.ts --format cjs,esm --dts
          npx semantic-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish @eduardoks98/google-adsense
      - name: Publish @eduardoks98/google-adsense
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'google-adsense' || github.event.inputs.package == 'all'))
        working-directory: packages/google/adsense/npm
        run: |
          npm install
          chmod +x ./node_modules/.bin/*
          ./node_modules/.bin/tsup src/index.ts --format cjs,esm --dts
          npx semantic-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish @eduardoks98/facebook-ads
      - name: Publish @eduardoks98/facebook-ads
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'facebook-ads' || github.event.inputs.package == 'all'))
        working-directory: packages/facebook/ads/npm
        run: |
          npm install
          chmod +x ./node_modules/.bin/*
          ./node_modules/.bin/tsup src/index.ts --format cjs,esm --dts
          npx semantic-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish @mysys/create-game
      - name: Publish @mysys/create-game
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'create-game' || github.event.inputs.package == 'all'))
        working-directory: node-sdk/packages/create-game
        run: |
          npm install --legacy-peer-deps
          npx tsc
          npx semantic-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
