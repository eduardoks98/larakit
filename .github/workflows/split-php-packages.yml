# Split dos pacotes PHP do larakit em repos espelho read-only (consumo via Composer/VCS).
# Disparo: tag `php-vX.Y.Z` no monorepo → cada pacote vira tag `vX.Y.Z` no seu repo espelho.
# Os repos espelho NÃO devem ser editados à mão (a fonte é este monorepo).
name: Split PHP packages

on:
  push:
    tags:
      - 'php-v*'
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # core
          - local: packages/core/base-api
            repo: base-api
          - local: packages/core/helpers
            repo: helpers
          - local: packages/core/security
            repo: security
          - local: packages/core/rate-limiter
            repo: rate-limiter
          - local: packages/core/recaptcha
            repo: recaptcha
          - local: packages/core/auth
            repo: auth
          - local: packages/core/performance
            repo: performance
          - local: packages/core/reverb
            repo: reverb
          - local: packages/core/api-docs
            repo: api-docs
          - local: packages/core/health
            repo: health
          - local: packages/core/permissions
            repo: permissions
          # auth (social)
          - local: packages/auth/google
            repo: auth-google
          - local: packages/auth/facebook
            repo: auth-facebook
          - local: packages/auth/microsoft
            repo: auth-microsoft
          - local: packages/auth/discord
            repo: auth-discord
          # payment
          - local: packages/payment/stripe
            repo: payment-stripe
          - local: packages/payment/mercadopago
            repo: payment-mercadopago
          - local: packages/payment/abacatepay
            repo: payment-abacatepay
          # sms / whatsapp
          - local: packages/sms/twilio
            repo: sms-twilio
          - local: packages/sms/comtele
            repo: sms-comtele
          - local: packages/whatsapp/official
            repo: whatsapp-official
          - local: packages/whatsapp/converx
            repo: whatsapp-converx
          # storage
          - local: packages/storage/s3
            repo: storage-s3
          - local: packages/storage/media-library
            repo: media-library
          # brazilian
          - local: packages/brazilian/geolocation
            repo: geolocation
          - local: packages/brazilian/email-validator
            repo: email-validator
          - local: packages/brazilian/banking
            repo: banking
          # monetization / ads / analytics
          - local: packages/monetization/core
            repo: monetization
          - local: packages/ads/unity
            repo: ads-unity
          - local: packages/ads/applovin
            repo: ads-applovin
          - local: packages/ads/facebook
            repo: ads-facebook
          - local: packages/google/ads
            repo: ads-google
          - local: packages/google/adsense
            repo: ads-adsense
          - local: packages/analytics/google
            repo: analytics-google
    steps:
      # ref: master é ESSENCIAL: o trigger é uma tag; sem isto o checkout fica
      # detached e não há ref local `master` pra action empurrar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      # Deriva a tag do repo espelho da tag do monorepo: php-v1.0.0 -> v1.0.0
      - name: Compute split tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME#php-}" >> "$GITHUB_OUTPUT"

      # branch: master (a action default seria `main`, mas o larakit usa master)
      # + ref:master acima = a action acha a branch local e empurra master+tag.
      - name: Split ${{ matrix.repo }}
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_PUSH_TOKEN }}
        with:
          package_directory: ${{ matrix.local }}
          repository_organization: eduardoks98
          repository_name: ${{ matrix.repo }}
          user_name: eduardoks98
          user_email: devteam@grupodva.com.br
          branch: master
          tag: ${{ steps.tag.outputs.value }}
